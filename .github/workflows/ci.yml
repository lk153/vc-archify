# Quality gates (Plan §5). vc-archify supports Chromium-based browsers only,
# so every run tests Chromium.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 (Playwright deps support lags)
    timeout-minutes: 40
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json#packageManager; Node 24 comes from
      # devEngines.runtime (pnpm downloads it), so there is no setup-node step.
      - uses: pnpm/action-setup@v6
        with:
          cache: true   # caches the pnpm store, keyed on pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:engines
      - name: Viewer template is up to date
        run: pnpm viewer:check
      - name: Engine self-check
        run: pnpm vc-archify doctor
      - name: Engine render, parity and contract tests
        run: pnpm --filter @vca/render test

      - name: Build site (browser engine + gallery + next build)
        run: pnpm --filter @vca/web build
      - name: Typecheck
        run: pnpm --filter @vca/web exec tsc --noEmit
      - name: Engine browser gate (containment, readability, viewer chrome, themes)
        # Uses the runner's Google Chrome; known upstream deviations are listed in
        # scripts/browser-check-baseline.json. Advisory until it has run green on the
        # Linux runners (it was baselined on macOS): remove continue-on-error then.
        continue-on-error: true
        run: pnpm browser-check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @vca/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @vca/web e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
