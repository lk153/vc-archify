# Deploys with the Vercel CLI from GitHub Actions (Plan §4.0/§4.5): the build
# runs here with the pinned pnpm + Node 24, then the prebuilt output is uploaded.
# Vercel's Git auto-deploys stay off (apps/web/vercel.json).
#
#   pull_request (same repo)  → preview deployment + smoke test, URL in the job summary + PR comment
#   CI succeeded on main      → production deployment (no automated checks against production;
#                               verify it yourself, e.g. `pnpm smoke <url>`, docs/runbook.md)
#   workflow_dispatch(ref)    → redeploy an older tag/commit to production (rollback beyond
#                               the single step `vercel rollback` offers on Hobby)
#
# Required: repository secret VERCEL_TOKEN, and VERCEL_ORG_ID + VERCEL_PROJECT_ID
# (repository secrets or variables; values from `vercel link` → .vercel/project.json).
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET (smoke-test protected preview URLs), TURBO_TOKEN;
# repository variable TURBO_TEAM.
name: Deploy

on:
  pull_request:
    paths-ignore: ['**/*.md', 'design/**', 'docs/**']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch or SHA) to deploy to production
        required: true

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  # The IDs are not sensitive, so they may be repository secrets or variables.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TOKEN_IS_A_VARIABLE: ${{ vars.VERCEL_TOKEN != '' }}
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  deploy:
    # Never expose VERCEL_TOKEN to pull requests from forks; production only after CI passed.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 (Playwright deps support lags)
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          cache: true   # caches the pnpm store, keyed on pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:engines

      - name: Check Vercel credentials
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing Vercel credentials::Not available to this job:$missing. Add them in GitHub → Settings → Secrets and variables → Actions → Repository secrets (exact names, upper case). Environment secrets only work if they are in the '${{ github.event_name == 'pull_request' && 'preview' || 'production' }}' environment."
            if [ "$VERCEL_TOKEN_IS_A_VARIABLE" = "true" ]; then
              echo "::error title=VERCEL_TOKEN is a variable::VERCEL_TOKEN is saved as an Actions *variable*. Delete it there and save it as a *secret*."
            fi
            exit 1
          fi
          echo "Vercel credentials present (token, org ID, project ID)."

      - name: Pull Vercel project settings
        run: |
          TARGET=$([ "$GITHUB_EVENT_NAME" = "pull_request" ] && echo preview || echo production)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          pnpm exec vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build (vercel build)
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
          else
            pnpm exec vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt output
        id: deploy
        run: |
          # Production goes live directly (`--prod` assigns the production domains).
          # CI already ran every gate on this exact commit before this workflow started;
          # nothing here tests the production deployment itself.
          if [ "$TARGET" = "production" ]; then
            URL=$(pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(pnpm exec vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (preview URL)
        if: github.event_name == 'pull_request'
        # Preview URLs sit behind Vercel Deployment Protection; the smoke test reaches
        # them through `vercel curl` (VERCEL_TOKEN) or the optional
        # VERCEL_AUTOMATION_BYPASS_SECRET. If neither gets through, it skips (exit 0).
        run: pnpm smoke "${{ steps.deploy.outputs.url }}" --vercel-curl --allow-protected

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last \
            --body "Preview: ${{ steps.deploy.outputs.url }}" \
            || gh pr comment "${{ github.event.pull_request.number }}" --body "Preview: ${{ steps.deploy.outputs.url }}"
